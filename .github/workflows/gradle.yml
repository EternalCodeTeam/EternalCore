name: Java CI with Gradle

on:
  push:
    branches:
      - master

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: java-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Java 25
    runs-on: ubuntu-latest

    steps:
      - name: Find existing build comment
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: '<!-- eternalcore-dev-build -->'

      - name: Create progress comment
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.find-comment.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@v5
        id: create-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- eternalcore-dev-build -->
            ### 🚧 Build in progress...

            > [!NOTE]
            > A new commit has been pushed. A development build of **EternalCore** will be available here once the workflow completes.

      - name: Update progress comment
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body: |
            <!-- eternalcore-dev-build -->
            ### 🚧 Build in progress...

            > [!NOTE]
            > A new commit has been pushed. A development build of **EternalCore** will be available here once the workflow completes.
          edit-mode: replace

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build EternalCore
        run: ./gradlew :eternalcore-plugin:shadowJar

      - name: Upload development build
        uses: actions/upload-artifact@v7.0.1
        id: upload-artifact
        with:
          path: eternalcore-plugin/build/libs/EternalCore*.jar
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Update comment with download link
        if: >
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id || steps.create-comment.outputs.comment-id }}
          body: |
            <!-- eternalcore-dev-build -->
            ### 📦 Development Build Ready

            > [!WARNING]
            > **Do not use this build in production.** It is intended for testing purposes only and may be unstable.

            👉 [**Download EternalCore development build**](${{ steps.upload-artifact.outputs.artifact-url }})

            Built with **Java 25**.
          edit-mode: replace
          reactions: rocket

      - name: Update comment on failure
        if: >
          failure() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (steps.find-comment.outputs.comment-id != '' || steps.create-comment.outputs.comment-id != '')
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id || steps.create-comment.outputs.comment-id }}
          body: |
            <!-- eternalcore-dev-build -->
            ### ❌ Development Build Failed

            The latest EternalCore development build could not be created.

            👉 [**View workflow logs**](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          edit-mode: replace
