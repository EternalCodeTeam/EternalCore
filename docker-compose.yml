services:
  postgres:
    image: postgres:16
    container_name: eternalcore-postgres
    environment:
      POSTGRES_DB: eternalcore
      POSTGRES_USER: eternalcore
      POSTGRES_PASSWORD: eternalcore
    ports:
      - "5432:5432"
    volumes:
      - eternalcore-postgres-data:/var/lib/postgresql/data

volumes:
  eternalcore-postgres-data:
